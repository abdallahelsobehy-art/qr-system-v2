<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الورشة - نظام الـ QR والعملاء</title>
    <!-- مكتبة تخصيص وتوليد الـ QR -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <!-- خطوط عربية وتصميم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* القائمة الجانبية */
        aside {
            width: 260px;
            background: var(--card-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .logo-area h2 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }
        .nav-links button {
            width: 100%;
            padding: 12px 15px;
            text-align: right;
            background: none;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        .nav-links button.active, .nav-links button:hover {
            background: var(--primary);
            color: #fff;
        }
        /* المحتوى الرئيسي */
        main {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .tab-content {
            display: none;
            flex-grow: 1;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        button.btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button.btn:hover {
            background: var(--primary-dark);
        }
        /* شاشة المعاينة والتخصيص المتقدم للـ QR */
        .preview-container {
            display: flex;
            gap: 20px;
            height: calc(100vh - 120px);
        }
        .controls-pane {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .display-pane {
            flex: 1;
            background: #e2e8f0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        #qr-code-holder {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe.page-preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside>
        <div>
            <div class="logo-area">
                <h2>الورشة - إدارة الـ QR</h2>
            </div>
            <ul class="nav-links">
                <li><button class="tab-btn active" onclick="switchTab(0)">العملاء</button></li>
                <li><button class="tab-btn" onclick="switchTab(1)">إضافة عميل جديد</button></li>
                <li><button class="tab-btn" onclick="switchTab(2)">مصمم الصفحات</button></li>
                <li><button class="tab-btn" onclick="switchTab(3)" id="qr-tab-trigger">تخصيص وتوليد QR</button></li>
            </ul>
        </div>
        <div style="font-size: 0.85rem; text-align: center; color: #64748b;">
            نظام الورشة الذكي الإصدار 3.5
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main>
        <!-- التبويب الأول: العملاء -->
        <div class="tab-content active" id="tab-0">
            <h1>إدارة العملاء والروابط النشطة</h1>
            <div class="card">
                <p>قريباً عرض جدول بيانات العملاء المرتبطين بقاعدة بيانات Firebase.</p>
            </div>
        </div>

        <!-- التبويب الثاني: إضافة عميل جديد -->
        <div class="tab-content" id="tab-1">
            <h1>تسجيل عميل جديد</h1>
            <div class="card">
                <div class="form-group">
                    <label>اسم العميل / النشاط</label>
                    <input type="text" id="client-name" placeholder="أدخل اسم النشاط التجاري...">
                </div>
                <div class="form-group">
                    <label>رابط صفحة العميل (GitHub Pages)</label>
                    <input type="text" id="client-url" placeholder="https://username.github.io/project/">
                </div>
                <button class="btn" onclick="saveClientData()">حفظ البيانات</button>
            </div>
        </div>

        <!-- التبويب الثالث: مصمم الصفحات -->
        <div class="tab-content" id="tab-2">
            <h1>مخصص واجهة صفحة العميل</h1>
            <div class="card" style="height: 100%;">
                <p>قم بتخصيص ألوان، خطوط وأزرار واجهة صفحة العميل الخاصة بك.</p>
            </div>
        </div>

        <!-- التبويب الرابع: تخصيص وتوليد الـ QR وشاشة المعاينة -->
        <div class="tab-content" id="tab-3">
            <h1>تخصيص وتوليد رمز الاستجابة السريعة (QR Code)</h1>
            <div class="preview-container">
                <!-- لوحة التحكم وتغيير الخيارات -->
                <div class="controls-pane card">
                    <div class="form-group">
                        <label>الرابط المحتوى في الـ QR</label>
                        <input type="text" id="qr-text" value="https://el-worsha.github.io/smart-link" oninput="updateQRCode()">
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>لون النقاط</label>
                            <input type="color" id="qr-dot-color" value="#1e293b" onchange="updateQRCode()">
                        </div>
                        <div class="form-group">
                            <label>لون الخلفية</label>
                            <input type="color" id="qr-bg-color" value="#ffffff" onchange="updateQRCode()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>شكل النقاط</label>
                        <select id="qr-dot-style" onchange="updateQRCode()">
                            <option value="square">مربع (Square)</option>
                            <option value="dots">دائري (Dots)</option>
                            <option value="rounded">مستدير الحواف (Rounded)</option>
                            <option value="classy">راقي (Classy)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>معاينة صفحة العميل الحية (Live Page Preview)</label>
                        <div style="height: 200px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden;">
                            <iframe id="page-preview-frame" class="page-preview-frame" src="about:blank"></iframe>
                        </div>
                    </div>
                    <button class="btn" style="width: 100%; margin-top: 10px;" onclick="downloadQR()">تحميل الـ QR بجودة عالية</button>
                </div>
                <!-- لوحة عرض الـ QR الفعلي -->
                <div class="display-pane">
                    <div id="qr-code-holder"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // إعداد وتوليد مكتبة الـ QR Code Styling
        let qrCode = new QRCodeStyling({
            width: 300,
            height: 300,
            type: "svg",
            data: "https://el-worsha.github.io/smart-link",
            dotsOptions: {
                color: "#1e293b",
                type: "square"
            },
            backgroundOptions: {
                color: "#ffffff",
            },
            imageOptions: {
                hideBackgroundDots: true,
                imageSize: 0.4,
                margin: 0
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            qrCode.append(document.getElementById("qr-code-holder"));
            updatePagePreview();
        });

        // التنقل بين التبويبات
        function switchTab(index) {
            const buttons = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');
            
            buttons.forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
            contents.forEach((content, idx) => {
                content.classList.toggle('active', idx === index);
            });

            if (index === 3) {
                setTimeout(updatePagePreview, 100);
            }
        }

        // تحديث إعدادات الـ QR لحظياً
        function updateQRCode() {
            const text = document.getElementById('qr-text').value;
            const dotColor = document.getElementById('qr-dot-color').value;
            const bgColor = document.getElementById('qr-bg-color').value;
            const dotStyle = document.getElementById('qr-dot-style').value;

            qrCode.update({
                data: text,
                dotsOptions: {
                    color: dotColor,
                    type: dotStyle
                },
                backgroundOptions: {
                    color: bgColor
                }
            });

            updatePagePreview();
        }

        // تحديث شاشة المعاينة الفورية عبر الـ iframe
        function updatePagePreview() {
            const previewFrame = document.getElementById('page-preview-frame');
            const targetUrl = document.getElementById('qr-text').value;
            
            // حقن محتوى مصغر لمعاينة شكل الصفحة الفورية بناءً على الرابط الحالي
            const previewHtml = `
                <html dir="rtl">
                <head>
                    <style>
                        body { font-family: 'Cairo', sans-serif; padding: 15px; text-align: center; background: #fdfdfd; color: #333; }
                        .preview-box { border: 2px dashed #2563eb; padding: 15px; border-radius: 8px; background: #eff6ff; }
                        h3 { margin-bottom: 5px; color: #1e293b; font-size: 1.1rem; }
                        p { font-size: 0.85rem; color: #64748b; word-break: break-all; }
                    </style>
                </head>
                <body>
                    <div class="preview-box">
                        <h3>معاينة نشاط العميل</h3>
                        <p>${targetUrl}</p>
                    </div>
                </body>
                </html>
            `;
            
            try {
                const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                doc.open();
                doc.write(previewHtml);
                doc.close();
            } catch (e) {
                console.error("خطأ في تحديث معاينة الإطار:", e);
            }
        }

        function saveClientData() {
            alert("تم حفظ بيانات العميل بنجاح في قاعدة البيانات.");
        }

        function downloadQR() {
            qrCode.download({ name: "el-worsha-qr", extension: "svg" });
        }
    </script>
</body>
</html>
