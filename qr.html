<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Profile</title>

<style>

/* إخفاء الصفحة مؤقتاً في البداية لمنع ظهور أي ومض قبل التحويل المباشر */
body{
opacity: 0;
transition: opacity 0.2s;
background:url("assets/background.jpg") center center/cover no-repeat;
background-attachment:fixed;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

.card{
width:100%;
max-width:500px;
text-align:center;
}

/* غلاف الصورة العلويه */
.cover-image {
width: 100%;
height: 200px;
border-radius: 18px;
margin-bottom: 20px;
overflow: hidden;
position: relative;
background: url("assets/background.jpg") center center/cover;
box-shadow: 0 6px 15px rgba(0,0,0,.25);
}

.cover-image img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

/* إطار اللوجو */
.logo-container{
width: 100%;
height: 200px;
border-radius: 18px;
margin: 20px auto;
overflow: hidden;
position: relative;
background: url("assets/card-bg.jpg") center center/cover;
box-shadow: 0 6px 15px rgba(0,0,0,.25);
display: flex;
align-items: center;
justify-content: center;
padding: 15px;
}

.logo-container::before{
content: "";
position: absolute;
inset: 0;
background: rgba(255,255,255,.75);
z-index: 1;
}

.logo-container img{
max-width: 100%;
max-height: 100%;
object-fit: contain;
position: relative;
z-index: 2;
display: block;
}

#name{
color:#fff;
font-size:34px;
margin-bottom:5px;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}

#description{
color:#fff;
font-size:18px;
margin-bottom:30px;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}

.btn{
display:flex;
align-items:center;
justify-content:center;
padding:18px 20px;
margin-bottom:15px;
border-radius:18px;
text-decoration:none;
color:#111;
font-size:20px;
font-weight:bold;
position:relative;
overflow:hidden;
background:url("assets/card-bg.jpg");
background-size:cover;
background-position:center;
box-shadow:0 6px 15px rgba(0,0,0,.25);
cursor:pointer;
}

.btn::before{
content:"";
position:absolute;
inset:0;
background:rgba(255,255,255,.75);
}

.btn span{
position:relative;
z-index:2;
}

.btn img{
position:absolute;
right:20px;
z-index:2;
}

.custom-icon{
width:38px;
height:38px;
object-fit:contain;
}

.footer{
margin-top:20px;
color:#fff;
font-size:15px;
font-weight:bold;
text-shadow:0 2px 5px rgba(0,0,0,.5);
}

</style>

</head>


<body>


<div class="card">

<!-- غلاف الصورة العلوي -->
<div id="coverWrapper" class="cover-image" style="display:none;">
    <img id="coverImage">
</div>

<!-- برواز اللوجو -->
<div id="logoWrapper" class="logo-container" style="display:none;">
    <img id="logo">
</div>

<h1 id="name"></h1>

<p id="description"></p>

<!-- 📞 زر الاتصال المباشر -->
<a id="phone" class="btn" style="display:none;">
<img src="assets/call.png" class="custom-icon">
<span>Call me</span>
</a>

<!-- واتساب -->
<a id="whatsapp" class="btn" target="_blank" style="display:none;">
<img src="assets/whatsapp.png" class="custom-icon">
<span>WhatsApp</span>
</a>

<!-- تليجرام -->
<a id="telegram" class="btn" target="_blank" style="display:none;">
<img src="assets/telegram.png" class="custom-icon">
<span>Telegram</span>
</a>

<!-- مسنجر -->
<a id="messenger" class="btn" target="_blank" style="display:none;">
<img src="assets/messenger.png" class="custom-icon">
<span>Messenger</span>
</a>

<!-- فيسبوك -->
<a id="facebook" class="btn" target="_blank" style="display:none;">
<img src="assets/facebook.png" class="custom-icon">
<span>Facebook</span>
</a>

<!-- انستجرام -->
<a id="instagram" class="btn" target="_blank" style="display:none;">
<img src="assets/instagram.png" class="custom-icon">
<span>Instagram</span>
</a>

<!-- تيك توك -->
<a id="tiktok" class="btn" target="_blank" style="display:none;">
<img src="assets/tiktok.png" class="custom-icon">
<span>TikTok</span>
</a>

<!-- سناب شات -->
<a id="snapchat" class="btn" target="_blank" style="display:none;">
<img src="assets/snapchat.png" class="custom-icon">
<span>Snapchat</span>
</a>

<!-- بنترست -->
<a id="pinterest" class="btn" target="_blank" style="display:none;">
<img src="assets/pinterest.png" class="custom-icon">
<span>Pinterest</span>
</a>

<!-- يوتيوب -->
<a id="youtube" class="btn" target="_blank" style="display:none;">
<img src="assets/youtube.png" class="custom-icon">
<span>YouTube</span>
</a>

<!-- لينكد إن -->
<a id="linkedin" class="btn" target="_blank" style="display:none;">
<img src="assets/linkedin.png" class="custom-icon">
<span>LinkedIn</span>
</a>

<!-- الموقع الإلكتروني -->
<a id="website" class="btn" target="_blank" style="display:none;">
<img src="assets/website.png" class="custom-icon">
<span>Website</span>
</a>

<!-- الكتالوج -->
<a id="catalog" class="btn" target="_blank" style="display:none;">
<img src="assets/catalog.png" class="custom-icon">
<span>Catalog</span>
</a>

<!-- الجيميل -->
<a id="gmail" class="btn" target="_blank" style="display:none;">
<img src="assets/gmail.png" class="custom-icon">
<span>Email</span>
</a>

<!-- الموقع الجغرافي -->
<a id="location" class="btn" target="_blank" style="display:none;">
<img src="assets/location.png" class="custom-icon">
<span>Location</span>
</a>

<!-- ⭐ زر المراجعات -->
<a id="review" class="btn" target="_blank" style="display:none;">
<img src="assets/review.png" class="custom-icon">
<span>Review</span>
</a>

<!-- InstaPay -->
<a id="instapay" class="btn" target="_blank" style="display:none;">
<img src="assets/instapay.png" class="custom-icon">
<span>InstaPay</span>
</a>

<!-- Vodafone Cash -->
<a id="vodafonecash" class="btn" target="_blank" style="display:none;">
<img src="assets/cash.png" class="custom-icon">
<span>Cash</span>
</a>

<!-- Orange Cash -->
<a id="orangecash" class="btn" target="_blank" style="display:none;">
<img src="assets/orange.png" class="custom-icon">
<span>Orange Cash</span>
</a>

<!-- Etisalat Cash -->
<a id="etisalatcash" class="btn" target="_blank" style="display:none;">
<img src="assets/etisalat.png" class="custom-icon">
<span>Etisalat Cash</span>
</a>

<!-- WE Cash -->
<a id="wecash" class="btn" target="_blank" style="display:none;">
<img src="assets/we.png" class="custom-icon">
<span>WE Cash</span>
</a>

<!-- نص الحقوق الديناميكي -->
<div id="footerText" class="footer"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyB2YTSo-sIhXUFMOlHV8AEVaduS9l1pwz8",
  authDomain: "qr-system-b7326.firebaseapp.com",
  databaseURL: "https://qr-system-b7326-default-rtdb.firebaseio.com",
  projectId: "qr-system-b7326",
  storageBucket: "qr-system-b7326.firebasestorage.app",
  messagingSenderId: "316223189996",
  appId: "1:316223189996:web:83895e0d6dc28ad99606c9",
  measurementId: "G-RZLFVNXNV1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const preview = params.get("preview");

let currentDesign = {};

/* تطبيق التصميم على الصفحة */
function applyDesign(design) {
    currentDesign = design;

    /* خلفية الصفحة */
    if (design.backgroundType === "upload" && design.backgroundImage) {
        document.body.style.backgroundImage = `url('${design.backgroundImage}')`;
    } else {
        document.body.style.backgroundImage = `url("assets/background.jpg")`;
    }

    /* الخطوط */
    if (design.fontFamily) {
        document.body.style.fontFamily = design.fontFamily;
    }

    if (design.fontColor) {
        document.getElementById("name").style.color = design.fontColor;
        document.getElementById("description").style.color = design.fontColor;
    }

    if (design.fontSize) {
        document.getElementById("name").style.fontSize = design.fontSize + "px";
        document.getElementById("description").style.fontSize = Math.max(14, parseInt(design.fontSize) - 6) + "px";
    }

    /* الأزرار */
    const buttons = document.querySelectorAll(".btn");
    buttons.forEach(btn => {
        /* خلفية الزر */
        if (design.buttonBgType === "upload" && design.buttonBgImage) {
            btn.style.backgroundImage = `url('${design.buttonBgImage}')`;
        } else {
            btn.style.backgroundImage = `url("assets/card-bg.jpg")`;
        }

        /* لون خلفية الزر */
        if (design.buttonBgColor) {
            btn.style.backgroundColor = design.buttonBgColor;
        }

        /* درجة الحدة */
        if (design.buttonRadius !== undefined) {
            btn.style.borderRadius = design.buttonRadius + "px";
        }

        /* الظل */
        if (design.buttonShadow !== undefined) {
            btn.style.boxShadow = `0 ${design.buttonShadow}px ${design.buttonShadow * 2.5}px rgba(0,0,0,.25)`;
        }

        /* لون النص */
        if (design.buttonTextColor) {
            const span = btn.querySelector("span");
            if (span) span.style.color = design.buttonTextColor;
        }

        /* لون الأيقونة */
        if (design.iconColor) {
            const icon = btn.querySelector(".custom-icon");
            if (icon) {
                icon.style.filter = `drop-shadow(0 0 0 ${design.iconColor})`;
                icon.style.color = design.iconColor;
            }
        }

        /* حجم الأيقونة */
        const icon = btn.querySelector(".custom-icon");
        if (icon) {
            let iconSize = 38;
            if (design.iconSize === "small") iconSize = 28;
            if (design.iconSize === "large") iconSize = 48;
            icon.style.width = iconSize + "px";
            icon.style.height = iconSize + "px";
        }

        /* مكان الأيقونة */
        if (design.iconPosition) {
            const icon = btn.querySelector(".custom-icon");
            if (icon) {
                switch(design.iconPosition) {
                    case "left":
                        icon.style.right = "auto";
                        icon.style.left = "20px";
                        btn.style.flexDirection = "row-reverse";
                        break;
                    case "top":
                        icon.style.position = "relative";
                        icon.style.right = "auto";
                        btn.style.flexDirection = "column-reverse";
                        break;
                    case "bottom":
                        icon.style.position = "relative";
                        icon.style.right = "auto";
                        btn.style.flexDirection = "column";
                        break;
                    default: // right
                        icon.style.right = "20px";
                        btn.style.flexDirection = "row";
                }
            }
        }
    });

    /* شكل الأيقونة */
    const icons = document.querySelectorAll(".custom-icon");
    icons.forEach(icon => {
        let radius = "0";
        if (design.iconShape === "rounded") radius = "8px";
        if (design.iconShape === "circle") radius = "50%";
        icon.style.borderRadius = radius;
    });

    /* اللوجو */
    const logoImg = document.getElementById("logo");
    const logoWrapper = document.getElementById("logoWrapper");
    if (design.logoType === "upload" && design.logoImage) {
        logoImg.src = design.logoImage;
        logoWrapper.style.display = "flex";
    } else if (design.logoImage === "") {
        logoWrapper.style.display = "none";
    }

    /* صورة الغلاف */
    const coverImg = document.getElementById("coverImage");
    const coverWrapper = document.getElementById("coverWrapper");
    if (design.coverType === "upload" && design.coverImage) {
        coverImg.src = design.coverImage;
        coverWrapper.style.display = "block";
    } else if (design.coverImage === "") {
        coverWrapper.style.display = "none";
    }
}

/* استقبال التصميم من صفحة المعاينة */
window.addEventListener("message", function(event) {
    if (event.data.type === "applyDesign") {
        applyDesign(event.data.design);
    }
});

/* تحميل البيانات من Firebase */
db.ref("customers/" + id).once("value")
.then(function(snapshot){
    const data = snapshot.val();

    if(!data){
        document.querySelector(".card").innerHTML =
        "<h2 style='color:white'>العميل غير موجود</h2>";
        document.body.style.opacity = "1";
        return;
    }

    /* التوجيه المباشر لو موجود ولسنا في وضع المعاينة */
    if (!preview && data.redirectUrl && data.redirectUrl.trim() !== "") {
        window.location.replace(data.redirectUrl.trim());
        return;
    }

    /* إظهار الصفحة */
    document.body.style.opacity = "1";

    /* معالجة عرض إطار اللوجو */
    const logoElem = document.getElementById("logo");
    const logoWrapper = document.getElementById("logoWrapper");

    if (data.logo && data.logo.trim() !== "") {
        logoElem.src = data.logo;
        logoWrapper.style.display = "flex";
    } else {
        logoWrapper.style.display = "none";
    }

    document.getElementById("name").textContent = data.name || "";
    document.getElementById("description").textContent = data.description || "";

    /* ربط وإظهار الأزرار */
    if (data.phone && data.phone.trim() !== "") {
        const phoneBtn = document.getElementById("phone");
        phoneBtn.href = "tel:" + data.phone.trim();
        phoneBtn.style.display = "flex";
    }

    if (data.whatsapp && data.whatsapp.trim() !== "") {
        const el = document.getElementById("whatsapp");
        let waNum = data.whatsapp.replace(/\D/g, '');
        el.href = "https://wa.me/" + waNum;
        el.style.display = "flex";
    }

    if (data.telegram && data.telegram.trim() !== "") {
        const el = document.getElementById("telegram");
        el.href = data.telegram.trim();
        el.style.display = "flex";
    }

    if (data.messenger && data.messenger.trim() !== "") {
        const el = document.getElementById("messenger");
        el.href = data.messenger.trim();
        el.style.display = "flex";
    }

    if (data.facebook && data.facebook.trim() !== "") {
        const el = document.getElementById("facebook");
        el.href = data.facebook.trim();
        el.style.display = "flex";
    }

    if (data.instagram && data.instagram.trim() !== "") {
        const el = document.getElementById("instagram");
        el.href = data.instagram.trim();
        el.style.display = "flex";
    }

    if (data.tiktok && data.tiktok.trim() !== "") {
        const el = document.getElementById("tiktok");
        el.href = data.tiktok.trim();
        el.style.display = "flex";
    }

    if (data.snapchat && data.snapchat.trim() !== "") {
        const el = document.getElementById("snapchat");
        el.href = data.snapchat.trim();
        el.style.display = "flex";
    }

    if (data.pinterest && data.pinterest.trim() !== "") {
        const el = document.getElementById("pinterest");
        el.href = data.pinterest.trim();
        el.style.display = "flex";
    }

    if (data.youtube && data.youtube.trim() !== "") {
        const el = document.getElementById("youtube");
        el.href = data.youtube.trim();
        el.style.display = "flex";
    }

    if (data.linkedin && data.linkedin.trim() !== "") {
        const el = document.getElementById("linkedin");
        el.href = data.linkedin.trim();
        el.style.display = "flex";
    }

    if (data.website && data.website.trim() !== "") {
        const el = document.getElementById("website");
        el.href = data.website.trim();
        el.style.display = "flex";
    }

    if (data.catalog && data.catalog.trim() !== "") {
        const el = document.getElementById("catalog");
        el.href = data.catalog.trim();
        el.style.display = "flex";
    }

    if (data.gmail && data.gmail.trim() !== "") {
        const el = document.getElementById("gmail");
        el.href = "mailto:" + data.gmail.trim();
        el.style.display = "flex";
    }

    if (data.location && data.location.trim() !== "") {
        const el = document.getElementById("location");
        el.href = data.location.trim();
        el.style.display = "flex";
    }

    if (data.review && data.review.trim() !== "") {
        const el = document.getElementById("review");
        el.href = data.review.trim();
        el.style.display = "flex";
    }

    if (data.instapay && data.instapay.trim() !== "") {
        const el = document.getElementById("instapay");
        el.href = "https://ipn.eg/" + data.instapay.trim();
        el.style.display = "flex";
    }

    if (data.vodafonecash && data.vodafonecash.trim() !== "") {
        const el = document.getElementById("vodafonecash");
        el.href = data.vodafonecash.trim();
        el.style.display = "flex";
    }

    if (data.orangecash && data.orangecash.trim() !== "") {
        const el = document.getElementById("orangecash");
        el.href = data.orangecash.trim();
        el.style.display = "flex";
    }

    if (data.etisalatcash && data.etisalatcash.trim() !== "") {
        const el = document.getElementById("etisalatcash");
        el.href = data.etisalatcash.trim();
        el.style.display = "flex";
    }

    if (data.wecash && data.wecash.trim() !== "") {
        const el = document.getElementById("wecash");
        el.href = data.wecash.trim();
        el.style.display = "flex";
    }

    /* معالجة عرض نص الحقوق */
    document.getElementById("footerText").textContent = 
        (data.footer && data.footer.trim() !== "") ? data.footer : "جميع الحقوق محفوظة ✓";

    /* تطبيق التصميم المخصص إن وجد */
    if (data.design) {
        applyDesign(data.design);
    }

});

</script>

</body>
</html>
