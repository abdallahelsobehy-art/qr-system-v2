<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تخصيص صفحة العميل</title>

    <link rel="stylesheet" href="css/page-designer.css">
</head>
<body>

<div class="container">

    <h1>✨ تخصيص صفحة العميل</h1>

    <div class="card">

        <label>لون الخلفية</label>
        <input type="color" id="bgColor" value="#ffffff">

        <label>لون النص</label>
        <input type="color" id="textColor" value="#222222">

        <label>
            <input type="checkbox" id="showLogo" checked>
            إظهار اللوجو
        </label>

        <label>
            <input type="checkbox" id="showDescription" checked>
            إظهار الوصف
        </label>

        <button id="saveBtn">
            حفظ الإعدادات
        </button>

    </div>

</div>

<script src="js/page-designer.js"></script>
</body>
</html>
