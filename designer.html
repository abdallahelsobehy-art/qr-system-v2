<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مصمم صفحة العميل</title>

<link rel="stylesheet" href="css/page-designer.css">
</head>

<body>

<div class="designer-container">

    <div class="controls">

        <h2>✨ تخصيص صفحة العميل</h2>

        <label>لون الخلفية</label>
        <input type="color" id="bgColor" value="#ffffff">

        <label>لون النص</label>
        <input type="color" id="textColor" value="#222222">

        <label>
            <input type="checkbox" id="showLogo" checked>
            إظهار اللوجو
        </label>

        <label>
            <input type="checkbox" id="showDescription" checked>
            إظهار الوصف
        </label>

    </div>

    <div class="preview-area">

        <div class="phone-preview" id="preview">

            <img
                id="previewLogo"
                class="logo"
                src="https://via.placeholder.com/120"
            >

            <h2 id="previewTitle">
                اسم النشاط
            </h2>

            <p id="previewDescription">
                وصف النشاط التجاري يظهر هنا
            </p>

            <div class="btn">WhatsApp</div>
            <div class="btn">Facebook</div>
            <div class="btn">Instagram</div>

        </div>

    </div>

</div>

<script src="js/page-designer.js"></script>

</body>
</html>
