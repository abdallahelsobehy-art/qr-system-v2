<script>
    deferredPrompt = null;

        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';

            deferredPrompt.prompt();

                installBtn.style.display = 'none';
            });

    });

    const ADMIN_USERNAME = "abdallah.haroun";
    const ADMIN_PASSWORD = "CODE010951";

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function selectOption(hiddenInputId, value, element) {
        document.getElementById(hiddenInputId).value = value;
        const parentGrid = element.parentElement;
        parentGrid.querySelectorAll('.option-box').forEach(box => box.classList.remove('active'));
        element.classList.add('active');

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("adminPassword");
        const toggleIcon = document.getElementById("toggleEyeIcon");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.src = "assets/eye-open.png";
        } else {
            passwordInput.type = "password";
            toggleIcon.src = "assets/eye-closed.png";
        }
    }

    function showCustomAlert(message, callback) {
        const modal = document.getElementById("customModal");
        const msgEl = document.getElementById("customModalMsg");
        const buttonsEl = document.getElementById("customModalButtons");

        msgEl.textContent = message;
        buttonsEl.innerHTML = '<button class="custom-modal-btn btn-modal-ok" id="modalOkBtn">حسناً</button>';
        modal.style.display = "flex";

        document.getElementById("modalOkBtn").onclick = function() {
            modal.style.display = "none";
            if (callback) callback();
        };
    }

    function showCustomConfirm(message, onConfirm) {
        const modal = document.getElementById("customModal");
        const msgEl = document.getElementById("customModalMsg");
        const buttonsEl = document.getElementById("customModalButtons");

        msgEl.textContent = message;
        buttonsEl.innerHTML = `
            <button class="custom-modal-btn btn-modal-cancel" id="modalCancelBtn">إلغاء</button>
            <button class="custom-modal-btn btn-modal-ok" style="background-color: #c53030;" id="modalConfirmBtn">تــــأكـيد</button>
        `;
        modal.style.display = "flex";

        document.getElementById("modalCancelBtn").onclick = function() {
            modal.style.display = "none";
        };

        document.getElementById("modalConfirmBtn").onclick = function() {
            modal.style.display = "none";
            if (onConfirm) onConfirm();
        };
    }

    window.onload = function() {
        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("adminContainer").style.display = "block";
            document.getElementById("stickyFooter").style.display = "flex";
            loadCustomerList();
            generateNextCustomerCode();

    };

    function checkLogin() {
        const inputUser = document.getElementById("adminUsername").value.trim();
        const inputPass = document.getElementById("adminPassword").value.trim();
        const errorMsg = document.getElementById("loginError");

        if (inputUser === ADMIN_USERNAME && inputPass === ADMIN_PASSWORD) {
            sessionStorage.setItem("adminLoggedIn", "true");
            document.getElementById("loginModal").style.display = "none";

            document.getElementById("stickyFooter").style.display = "flex";
            errorMsg.style.display = "none";
            loadCustomerList();
            generateNextCustomerCode();
        } else {

        if (e.key === "Enter") {
            checkLogin();
        }
    }

    function logout() {
        sessionStorage.removeItem("adminLoggedIn");
        location.reload();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyB2YTSo-sIhXUFMOlHV8AEVaduS9l1pwz8",
      authDomain: "qr-system-b7326.firebaseapp.com",
      databaseURL: "https://qr-system-b7326-default-rtdb.firebaseio.com",
      projectId: "qr-system-b7326",
      storageBucket: "qr-system-b7326.firebasestorage.app",
      messagingSenderId: "316223189996",
      appId: "1:316223189996:web:83895e0d6dc28ad99606c9",
      measurementId: "G-RZLFVNXNV1"
    };

    firebase.initializeApp(firebaseConfig);
    // تعديل مهم: اجعل مرجع قاعدة البيانات خاصية على window ليتم الوصول إليها من iframe التابع (page-designer)
    window.db = firebase.database();

    let qrCodeInstance = null;

    function SafeSetValue(id, val) {
        const el = document.getElementById(id);
        if (el) el.value = val || "";
    }

    function SafeGetValue(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
    }

    function generateNextCustomerCode() {
        let randomPrefixNums = "";
        for (let i = 0; i < 7; i++) {
            randomPrefixNums += Math.floor(Math.random() * 10);
        }
        
        const prefixCode = "CODE:" + randomPrefixNums;

        db.ref("customers").once("value").then(snapshot => {
            const data = snapshot.val();
            let maxSeq = 0;

            if (data) {
                Object.keys(data).forEach(key => {
                    if (key.length >= 5) {
                        const lastFive = key.slice(-5);
                        const num = parseInt(lastFive, 10);
                        if (!isNaN(num) && num > maxSeq) {
                            maxSeq = num;
                        }
                    }
                });
            }

            const nextSeq = maxSeq + 1;
            const formattedSeq = String(nextSeq).padStart(5, "0");
            const nextCode = prefixCode + formattedSeq;

            SafeSetValue("code", nextCode);
            SafeSetValue(
                "redirectUrl",
                "https://abdallahelsobehy-art.github.io/Qr-codes/?code=" + nextCode
            );
        }).catch(err => {
            SafeSetValue("code", prefixCode + "00001");
            SafeSetValue(
                "redirectUrl",
                "https://abdallahelsobehy-art.github.io/Qr-codes/?code=" + (prefixCode + "00001")
            );
        });
    }

    function SafeSetValue(elementId, val) {
      const el = document.getElementById(elementId);
      if (el) el.value = val || "";
    }

    function SafeGetValue(elementId) {
      const el = document.getElementById(elementId);
      return el ? el.value : "";
    }

    function generateNumber() {
      db.ref("customers").once("value").then(function(snapshot) {
        let max = 0;

        snapshot.forEach(function(child) {  
          const code = child.key || "";  

          if (code.startsWith("CODE")) {  
            const number = parseInt(code.replace("CODE", ""), 10) || 0;  
            if (number > max) max = number;  
          }  
        });  

        const next = max + 1;  
        
        const idElem = document.getElementById("id");
        if (idElem) {
          idElem.value = "CODE" + String(next).padStart(3, "0");
        }

      });
    }

    // بقية الدوال (loadCustomerList, loadSelectedCustomer, searchCustomerByCode, populateForm, ...) كما كانت...
    // تم إجراء تعديلين محددين لاحقاً في populateForm و saveCustomer كما طُلب.

    function loadCustomerList() {
        db.ref("customers").on("value", function(snapshot) {
            const select = document.getElementById("customerSelect");
            select.innerHTML = '<option value="">اختر العميل</option>';
            
            let customers = [];
            snapshot.forEach(function(child) {
                customers.push({
                    key: child.key,
                    data: child.val()
                });
            });

            customers.sort((a, b) => {
                return parseInt(a.key.slice(-5)) - parseInt(b.key.slice(-5));
            });

            customers.forEach(function(customer) {
                const option = document.createElement("option");
                option.value = customer.key;
                option.textContent = (customer.data.name || "بدون اسم") + " (" + customer.key + ")";
                select.appendChild(option);
            });
        });
    }

    function loadSelectedCustomer() {
        const id = SafeGetValue("customerSelect");
        if (!id) return;

        db.ref("customers/" + id).once("value").then(function(snapshot) {
            const data = snapshot.val();
            if (data) {
                populateForm(id, data);
            }
        });
    }

    function searchCustomerByCode() {
        const code = SafeGetValue("searchCode");
        if (!code) {
            showCustomAlert("يرجى إدخال كود العميل للبحث");
            return;
        }

        db.ref("customers/" + code).once("value").then(function(snapshot) {
            const data = snapshot.val();
            if (data) {
                populateForm(code, data);
            } else {
                showCustomAlert("لم يتم العثور على عميل بهذا الكود");
            }
        });
    }

    function populateForm(id, data) {
        SafeSetValue("code", id);
        SafeSetValue("redirectUrl", data.redirectUrl);
        SafeSetValue("name", data.name);
        SafeSetValue("description", data.description);
        SafeSetValue("logo", data.logo);
        SafeSetValue("phone", data.phone);
        SafeSetValue("whatsapp", data.whatsapp);
        SafeSetValue("telegram", data.telegram);
        SafeSetValue("messenger", data.messenger);
        SafeSetValue("facebook", data.facebook);
        SafeSetValue("instagram", data.instagram);
        SafeSetValue("tiktok", data.tiktok);
        SafeSetValue("snapchat", data.snapchat);
        SafeSetValue("pinterest", data.pinterest);
        SafeSetValue("youtube", data.youtube);
        SafeSetValue("linkedin", data.linkedin);
        SafeSetValue("website", data.website);
        SafeSetValue("catalog", data.catalog);
        SafeSetValue("gmail", data.gmail);
        SafeSetValue("location", data.location);
        SafeSetValue("review", data.review);
        SafeSetValue("instapay", data.instapay);
        SafeSetValue("vodafonecash", data.vodafonecash);
        SafeSetValue("footer", data.footer);

        const preview = document.getElementById("logoPreview");
        if (data.logo && preview) {
            preview.src = data.logo;
            preview.style.display = "block";
        } else if (preview) {
            preview.style.display = "none";
        }

        generateQR();

        // طلب تحميل إعدادات التبويب 4 (page designer) لعميل محدد داخل iframe (إذا كان iframe موجود)
        try {
            const frame = document.getElementById("pageDesignerFrame");
            if (frame && frame.contentWindow && typeof frame.contentWindow.loadCustomerDesign === "function") {
                frame.contentWindow.loadCustomerDesign(id);
            }
        } catch (e) {
            console.log("Error calling loadCustomerDesign on iframe:", e);
        }
    }

    function saveCustomer() {
        const code = SafeGetValue("code");
        if (!code) {
            showCustomAlert("كود العميل غير موجود");
            return;
        }

        const customerData = {
            redirectUrl: SafeGetValue("redirectUrl"),
            name: SafeGetValue("name"),
            description: SafeGetValue("description"),
            logo: SafeGetValue("logo"),
            phone: SafeGetValue("phone"),
            whatsapp: SafeGetValue("whatsapp"),
            telegram: SafeGetValue("telegram"),
            messenger: SafeGetValue("messenger"),
            facebook: SafeGetValue("facebook"),
            instagram: SafeGetValue("instagram"),
            tiktok: SafeGetValue("tiktok"),
            snapchat: SafeGetValue("snapchat"),
            pinterest: SafeGetValue("pinterest"),
            youtube: SafeGetValue("youtube"),
            linkedin: SafeGetValue("linkedin"),
            website: SafeGetValue("website"),
            catalog: SafeGetValue("catalog"),
            gmail: SafeGetValue("gmail"),
            location: SafeGetValue("location"),
            review: SafeGetValue("review"),
            instapay: SafeGetValue("instapay"),
            vodafonecash: SafeGetValue("vodafonecash"),
            footer: SafeGetValue("footer")
        };

        // استخدم update بدلاً من set حتى لا يتم حذف الفرع customers/CODE/design
        db.ref("customers/" + code).update(customerData)
        .then(function() {
            showCustomAlert("تم حفظ بيانات العميل بنجاح", function() {
                showCustomConfirm("هل تريد تحميل ملف الـ QR الآن؟", function() {
                    downloadQR();
                });
            });
            // لم نعد ننادي clearForm() هنا مباشرة، تفادياً لمس فرع design أو مسح بيانات التصميم قبل حفظها.
        })
        .catch(function(error) {
            showCustomAlert("خطأ أثناء الحفظ: " + error.message);
        });
    }

    // بقية السكربت كما هو...
</script>
