<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الـ QR</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="icon" type="image/png" href="assets/icon.png">

    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            padding: 20px;
            direction: rtl;
            padding-bottom: 90px;
        }

        /* PWA Install Button Style */
        #installButton {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: opacity 0.2s;
        }
        #installButton:hover {
            opacity: 0.9;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #edf2f7;
        }

        .header-bar h2 {
            margin: 0;
            color: #222;
        }

        .btn-logout {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .tabs-nav {
            display: flex;
            background: #edf2f7;
            border-radius: 8px;
            padding: 5px;
            margin-bottom: 20px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #111;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            padding: 12px 20px;
            display: none;
            justify-content: center;
            gap: 15px;
            z-index: 1000;
        }

        .sticky-footer .btn {
            max-width: 200px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        input[type="text"], input[type="password"], input[type="color"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input[type="color"] {
            height: 42px;
            padding: 4px;
            cursor: pointer;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            border-color: #3b82f6;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preview-logo {
            max-width: 80px;
            max-height: 80px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
            border: 1px solid #ddd;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('assets/login-bg.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background: rgba(30, 35, 45, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 90%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .login-body .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .login-body input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 45px 14px 15px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .login-body input::placeholder {
            color: #94a3b8;
        }

        .login-body input:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.12);
        }

        .toggle-password-img {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .toggle-password-img:hover {
            opacity: 1;
        }

        .btn-login-submit {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            text-align: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-save { background-color: #111; color: #fff; }
        .btn-delete { background-color: #c53030; color: #fff; }
        .btn-qr { background-color: #2d3748; color: #fff; }

        #pageDesignerIframe {
            width: 100%;
            height: 1200px;
            border: none;
            border-radius: 15px;
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- PWA Install Button -->
<button id="installButton">📥 تثبيت التطبيق</button>

<div class="login-overlay" id="loginModal">
    <div class="login-card">
        <div class="login-header">
            <h2>تسجيل الدخول</h2>
            <p class="login-subtitle">مرحباً بك مجدداً، يرجى تسجيل الدخول إلى حسابك</p>
        </div>
        <div class="login-body">
            <div class="input-box">
                <input type="text" id="adminUsername" placeholder="اسم المستخدم" onkeypress="handleKeyPress(event)">
            </div>
            
            <div class="input-box">
                <input type="password" id="adminPassword" placeholder="كلمة المرور" onkeypress="handleKeyPress(event)">
                <img src="assets/eye-closed.png" id="toggleEyeIcon" class="toggle-password-img" alt="إظهار/إخفاء" onclick="togglePasswordVisibility()">
            </div>
            
            <p class="error-msg" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة!</p>

            <button class="btn-login-submit" onclick="checkLogin()">دخول</button>
        </div>
    </div>
</div>

<div class="container" id="adminContainer">
    <div class="header-bar">
        <h2><i class="fa-solid fa-qrcode"></i> إدارة العملاء والـ QR</h2>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
    </div>

    <!-- شريط التبويبات -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('tab-profile')"><i class="fa-solid fa-user-pen"></i> 1. بيانات العميل</button>
        <button class="tab-btn" onclick="switchTab('tab-contacts')"><i class="fa-solid fa-address-book"></i> 2. التواصل والروابط</button>
        <button class="tab-btn" onclick="switchTab('tab-qr')"><i class="fa-solid fa-wand-magic-sparkles"></i> 3. تصميم وتوليد الـ QR</button>
        <button class="tab-btn" onclick="switchTab('tab-page-designer')"><i class="fa-solid fa-palette"></i> 4. تخصيص الصفحة</button>
    </div>

    <!-- التبويب الرابع: تخصيص صفحة العميل -->
    <div id="tab-page-designer" class="tab-content">
        <iframe id="pageDesignerIframe" src="page-designer.html"></iframe>
    </div>

    <!-- باقي التبويبات -->
    <div id="tab-profile" class="tab-content active">
        <div class="form-group">
            <label><i class="fa-solid fa-fingerprint"></i> كود العميل</label>
            <input type="text" id="code" readonly style="background-color: #edf2f7; font-weight: bold;">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-building"></i> اسم النشاط</label>
            <input type="text" id="name" placeholder="اسم العميل أو الشركة">
        </div>
        <div class="form-group">
            <label><i class="fa-solid fa-align-right"></i> وصف النشاط</label>
            <textarea id="description" rows="2" placeholder="نبذة مختصرة عن الخدمات"></textarea>
        </div>
    </div>

    <div id="tab-contacts" class="tab-content">
        <div class="grid-2">
            <div class="form-group">
                <label><i class="fa-solid fa-phone"></i> الهاتف</label>
                <input type="text" id="phone" placeholder="01xxxxxxxxx">
            </div>
            <div class="form-group">
                <label><i class="fa-brands fa-whatsapp"></i> واتساب</label>
                <input type="text" id="whatsapp" placeholder="رقم الواتساب">
            </div>
        </div>
    </div>

    <div id="tab-qr" class="tab-content">
        <div class="form-group">
            <label><i class="fa-solid fa-palette"></i> تخصيص QR</label>
            <input type="color" id="qrDotColor" value="#000000">
        </div>
    </div>
</div>

<!-- شريط الأزرار الثابت -->
<div class="sticky-footer" id="stickyFooter">
    <button class="btn btn-save" onclick="saveCustomer()"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
    <button class="btn btn-qr" onclick="generateQR()"><i class="fa-solid fa-arrows-rotate"></i> توليد QR</button>
    <button class="btn btn-delete" onclick="deleteCustomer()"><i class="fa-solid fa-trash-can"></i> حذف</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    const ADMIN_USERNAME = "abdallah.haroun";
    const ADMIN_PASSWORD = "CODE010951";
    let db = null;
    let currentCode = "";

    const firebaseConfig = {
      apiKey: "AIzaSyB2YTSo-sIhXUFMOlHV8AEVaduS9l1pwz8",
      authDomain: "qr-system-b7326.firebaseapp.com",
      databaseURL: "https://qr-system-b7326-default-rtdb.firebaseio.com",
      projectId: "qr-system-b7326",
      storageBucket: "qr-system-b7326.firebasestorage.app",
      messagingSenderId: "316223189996",
      appId: "1:316223189996:web:83895e0d6dc28ad99606c9",
      measurementId: "G-RZLFVNXNV1"
    };

    firebase.initializeApp(firebaseConfig);
    db = firebase.database();

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');

        // تحديث iframe عند فتح التبويب 4
        if(tabId === 'tab-page-designer') {
            const iframe = document.getElementById('pageDesignerIframe');
            if(iframe && currentCode) {
                notifyPageDesigner();
            }
        }
    }

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("adminPassword");
        const toggleIcon = document.getElementById("toggleEyeIcon");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.src = "assets/eye-open.png";
        } else {
            passwordInput.type = "password";
            toggleIcon.src = "assets/eye-closed.png";
        }
    }

    window.onload = function() {
        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("adminContainer").style.display = "block";
            document.getElementById("stickyFooter").style.display = "flex";
        }
    };

    function checkLogin() {
        const inputUser = document.getElementById("adminUsername").value.trim();
        const inputPass = document.getElementById("adminPassword").value.trim();
        const errorMsg = document.getElementById("loginError");

        if (inputUser === ADMIN_USERNAME && inputPass === ADMIN_PASSWORD) {
            sessionStorage.setItem("adminLoggedIn", "true");
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("adminContainer").style.display = "block";
            document.getElementById("stickyFooter").style.display = "flex";
            errorMsg.style.display = "none";
        } else {
            errorMsg.style.display = "block";
        }
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") checkLogin();
    }

    function logout() {
        sessionStorage.removeItem("adminLoggedIn");
        location.reload();
    }

    function SafeSetValue(id, val) {
        const el = document.getElementById(id);
        if (el) el.value = val || "";
    }

    function SafeGetValue(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
    }

    // تنبيه صفحة page-designer بتحديث الكود
    function notifyPageDesigner() {
        const iframe = document.getElementById('pageDesignerIframe');
        if(iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({
                type: 'updateCustomerCode',
                code: currentCode
            }, '*');
        }
    }

    // عند تغيير الكود
    document.addEventListener('DOMContentLoaded', function() {
        const codeInput = document.getElementById('code');
        if(codeInput) {
            // المراقبة على أي تغيير في الكود
            const observer = new MutationObserver(() => {
                currentCode = codeInput.value;
                notifyPageDesigner();
            });
            observer.observe(codeInput, { attributes: true, attributeFilter: ['value'] });
        }
    });

    function saveCustomer() {
        const code = SafeGetValue('code');
        if (!code) {
            alert('لا يوجد كود للعميل');
            return;
        }
        alert('تم الحفظ بنجاح ✅');
    }

    function generateQR() {
        alert('تم توليد QR');
    }

    function deleteCustomer() {
        alert('تم الحذف');
    }
</script>

</body>
</html>
