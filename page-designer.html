<div class="designer-layout">

    <!-- لوحة التحكم -->
    <div class="designer-panel">

        <div class="designer-card">
            <h3>🖼️ أدوات الخلفية العامة</h3>

            <label>صورة خلفية الصفحة</label>
            <input type="file" id="bgImageInput" accept="image/*">

            <label>لون الخلفية</label>
            <input type="color" id="bgColorPicker" value="#0b7dbd">
        </div>

        <div class="designer-card">
            <h3>🖼️ خلفية الأزرار</h3>

            <label>صورة خلفية الأزرار</label>
            <input type="file" id="btnBgInput" accept="image/*">

            <label>لون الأزرار</label>
            <input type="color" id="btnColorPicker" value="#ffffff">
        </div>

        <div class="designer-card">
            <h3>🔤 الألوان والخطوط</h3>

            <label>لون النص</label>
            <input type="color" id="textColorPicker" value="#ffffff">

            <label>نوع الخط</label>
            <select id="fontSelector">
                <option value="Cairo">Cairo</option>
                <option value="Tajawal">Tajawal</option>
                <option value="Almarai">Almarai</option>
                <option value="Changa">Changa</option>
            </select>

            <label>حجم الخط</label>
            <input type="range" id="fontSizeRange"
                   min="12" max="40" value="18">
        </div>

        <div class="designer-card">
            <h3>🔘 استدارة الأزرار</h3>

            <label>شكل الأزرار</label>

            <div class="shape-options">

                <button type="button"
                        onclick="setRadius(0)">
                    مربع
                </button>

                <button type="button"
                        onclick="setRadius(20)">
                    نصف دائري
                </button>

                <button type="button"
                        onclick="setRadius(50)">
                    دائري
                </button>

                <button type="button"
                        onclick="setRadius(100)">
                    زجاجي
                </button>

            </div>
        </div>

    </div>


    <!-- شاشة المعاينة -->
    <div class="phone-preview-wrapper">

        <div class="phone-frame">

            <div id="livePreview" class="preview-screen">

                <div class="preview-logo">
                    <img id="previewLogo"
                         src="assets/default-logo.png">
                </div>

                <h1 id="previewTitle">
                    اسم النشاط
                </h1>

                <p id="previewDesc">
                    وصف النشاط التجاري
                </p>

                <div class="preview-links">

                    <a class="preview-btn">
                        رقم الهاتف
                    </a>

                    <a class="preview-btn">
                        واتساب
                    </a>

                    <a class="preview-btn">
                        فيسبوك
                    </a>

                    <a class="preview-btn">
                        انستجرام
                    </a>

                    <a class="preview-btn">
                        الموقع الإلكتروني
                    </a>

                    <a class="preview-btn">
                        خريطة الموقع
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>
