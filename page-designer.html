<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تخصيص صفحة العميل - الورشة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f0f3f8;
    font-family:'Cairo',sans-serif;
    padding:15px;
}

/* التخطيط */
.designer-layout{
    display:flex;
    flex-direction:row-reverse;
    gap:20px;
    align-items:flex-start;
}

/* منطقة الأدوات */
.designer-panel{
    flex:1;
    min-height:1200px;
}

/* شاشة المعاينة */
.preview-container{
    position:sticky;
    top:15px;
    width:180px;
    flex-shrink:0;
}

.phone-frame{
    width: 180px;
    height: 360px;
    background: #fff;
    border-radius: 25px;
    overflow: hidden;
    position: relative;
}

#previewFrame{
    width: 375px;
    height: 750px;
    border: none;
    background: #fff;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%) scale(0.485);
    transform-origin: top center;
}

/* بطاقات أقسام التخصيص */
.designer-card {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

.designer-card h3 {
    margin-bottom: 15px;
    color: #111;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid #edf2f7;
    padding-bottom: 10px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #444;
    font-size: 13px;
}

input[type="text"], input[type="color"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background-color: #fff;
    transition: border-color 0.2s;
    font-family: 'Cairo', sans-serif;
}

input[type="color"] {
    height: 42px;
    padding: 4px;
    cursor: pointer;
}

input[type="text"]:focus, select:focus {
    border-color: #3b82f6;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
    gap: 8px;
    margin-bottom: 10px;
}

.option-box {
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.option-box:hover {
    border-color: #cbd5e0;
    background: #f8fafc;
}

.option-box.active {
    border-color: #3b82f6;
    background: #eff6ff;
    box-shadow: 0 0 0 1px #3b82f6;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: 'Cairo', sans-serif;
}

.btn-save-design {
    background-color: #111;
    color: #fff;
    margin-top: 10px;
}

.btn:hover {
    opacity: 0.9;
}

/* معاينة الخطوط */
.font-cairo { font-family: 'Cairo', sans-serif; }
.font-tajawal { font-family: 'Tajawal', sans-serif; }
.font-changa { font-family: 'Changa', sans-serif; }

/* رفع الخلفيات */
.file-row{
display:flex;
flex-direction:column;
gap:8px;
}

.btn-file{
background:#4A5568;
color:#fff;
padding:9px 14px;
border-radius:8px;
font-size:13px;
font-weight:bold;
cursor:pointer;
width:fit-content;
display:inline-flex;
align-items:center;
gap:6px;
}

.btn-file:hover{
opacity:.9;
}

input[type="file"]{
display:none;
}

.bg-preview{
display:none;
margin-top:8px;
max-width:100%;
max-height:90px;
border-radius:8px;
border:1px solid #e2e8f0;
object-fit:cover;
}

/* موبايل */
@media(max-width:992px){

    .designer-layout{
        display:block;
    }

    .preview-container{
        position:relative;
        top:auto;
        width:100%;
        margin-bottom:20px;
    }

    .phone-frame{
        width:180px;
        height:360px;
        margin:auto;
    }
}
</style>
</head>
<body>

<div class="designer-layout">

    <!-- شاشة المعاينة -->
    <div class="preview-container">
        <div class="phone-frame">
            <iframe id="previewFrame" src="qr.html"></iframe>
        </div>
    </div>

    <!-- أدوات التخصيص -->
    <div class="designer-panel">
        <!-- جاهز للإضافة -->
    </div>

</div>

<script>
let currentLoadedCode = "";

/* تحميل صفحة المعاينة لعميل معين مع تمرير وضع المعاينة preview=1 لمنع التحويل */
function updatePagePreview(customerCode){
    if(!customerCode) return;
    currentLoadedCode = customerCode;

    const iframe = document.getElementById("previewFrame");
    iframe.src = `qr.html?id=${encodeURIComponent(customerCode)}&preview=1&t=${Date.now()}`;
}

/* جلب الكود من صفحة الأدمن تلقائياً ومزامنة البيانات */
function syncWithAdmin(){
    try{
        const parentDoc = window.parent.document;
        const codeInput = parentDoc.getElementById("code");

        if(!codeInput) return;

        if(codeInput.value){
            updatePagePreview(codeInput.value);
        }

        codeInput.addEventListener("input", function(){
            updatePagePreview(this.value);
        });

        const customerSelect = parentDoc.getElementById("customerSelect");
        if(customerSelect){
            customerSelect.addEventListener("change", function(){
                setTimeout(function(){
                    const currentCode = parentDoc.getElementById("code").value;
                    if (currentCode) {
                        updatePagePreview(currentCode);
                    }
                }, 500);
            });
        }
    }catch(err){
        console.log("Sync error:", err);
    }
}

window.onload = function(){
    syncWithAdmin();
};
</script>

</body>
</html>
