<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تخصيص صفحة العميل - الورشة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif;}
body{background:#f0f3f8;padding:15px;color:#333;}

/* الهيدر العلوي */
.header-top{background:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:15px;}
.header-top h2{font-size:18px;color:#111;display:flex;align-items:center;gap:8px;}
.header-top p{font-size:12px;color:#666;margin-top:2px;}

/* التخطيط العام: الشبكة المضبوطة تماماً مثل صورتك */
.designer-layout{display:grid;grid-template-columns:1fr 260px;gap:15px;align-items:start;}
.designer-panel{display:flex;flex-direction:column;gap:15px;}

.designer-card{background:#fff;padding:15px;border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.05);}
.designer-card h3{font-size:14px;margin-bottom:12px;color:#222;display:flex;align-items:center;gap:8px;}
.designer-card label{display:block;margin-top:10px;margin-bottom:5px;font-size:12px;font-weight:bold;color:#444;}
.designer-card select{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:12px;}

/* أزرار الاستدارة تماماً كالصورة */
.shape-options{display:grid;grid-template-columns:repeat(4, 1fr);gap:5px;margin-top:8px;}
.shape-btn{border:1px solid #ddd;padding:6px 2px;background:#fff;cursor:pointer;border-radius:8px;font-weight:bold;font-size:11px;text-align:center;transition:.2s;}
.shape-btn.active{border-color:#0b7dbd;background:#eef7fc;color:#0b7dbd;}

.range-box{display:flex;align-items:center;gap:10px;margin-top:6px;}
.range-box input[type="range"]{flex:1;}
.range-box input[type="number"]{width:55px;text-align:center;padding:5px;border:1px solid #ddd;border-radius:6px;font-size:12px;}

/* حاوية معاينة الموبايل المصغرة والعائمة تماماً مثل صورتك */
.preview-container{position:sticky;top:15px;}
.phone-frame{width:100%;max-width:250px;height:520px;background:#1a1a1a;padding:6px;border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin:0 auto;}
.preview-screen{
    height:100%;
    border-radius:20px;
    overflow-y:auto;
    padding:10px;
    background:url("assets/background.jpg") center center/cover no-repeat;
    background-attachment:local;
    color:white;
    text-align:center;
    position:relative;
}

/* شاشة معاينة اللوجو المصغرة */
.preview-logo-container{
    width: 100%;
    height: 95px;
    border-radius: 12px;
    margin: 6px auto;
    overflow: hidden;
    position: relative;
    background: url("assets/card-bg.jpg") center center/cover;
    box-shadow: 0 3px 8px rgba(0,0,0,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
}
.preview-logo-container::before{
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.75);
    z-index: 1;
}
.preview-logo-container img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 2;
    display: block;
}

#prevName{font-size:16px;margin-bottom:2px;text-shadow:0 2px 4px rgba(0,0,0,.5);font-weight:bold;}
#prevDesc{font-size:10px;margin-bottom:10px;text-shadow:0 2px 4px rgba(0,0,0,.5);opacity:.9;}

.preview-links{display:flex;flex-direction:column;gap:6px;}
.preview-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 10px;
    border-radius:18px;
    text-decoration:none;
    color:#111;
    font-size:12px;
    font-weight:bold;
    position:relative;
    overflow:hidden;
    background:url("assets/card-bg.jpg");
    background-size:cover;
    background-position:center;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.preview-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.75);
}
.preview-btn span{position:relative;z-index:2;}
.preview-btn img{position:absolute;right:10px;z-index:2;width:18px;height:18px;object-fit:contain;}

.preview-footer{margin-top:10px;font-size:10px;font-weight:bold;text-shadow:0 2px 3px rgba(0,0,0,.5);}

@media(max-width:992px){
.designer-layout{grid-template-columns:1fr;}
.preview-container{position:relative;top:0;margin-bottom:15px;}
}
</style>
</head>
<body>

<div class="header-top">
<h2><i class="fa-solid fa-paintbrush" style="color:#0b7dbd;"></i> تخصيص صفحة العميل</h2>
<p>المعاينة مصغرة وثابتة بالجانب تماماً كصورتك</p>
</div>

<div class="designer-layout">

<!-- لوحة التحكم والقوائم -->
<div class="designer-panel">

<div class="designer-card">
<h3><i class="fa-solid fa-font" style="color:#0b7dbd;"></i> الخطوط والنصوص</h3>
<label>نوع الخط</label>
<select id="fontSelector">
<option value="Tahoma">Tahoma</option>
<option value="Cairo">Cairo</option>
<option value="Tajawal">Tajawal</option>
<option value="Almarai">Almarai</option>
<option value="Changa">Changa</option>
</select>
<label>حجم الخط الأزرار</label>
<div class="range-box">
<input type="range" id="fontSizeRange" min="10" max="18" value="12">
<input type="number" id="fontSizeNum" value="12" min="10" max="18"> px
</div>
</div>

<div class="designer-card">
<h3><i class="fa-solid fa-shapes" style="color:#0b7dbd;"></i> استدارة الأزرار والبرواز</h3>
<div class="shape-options">
<button class="shape-btn" onclick="setShape(0, this)">مربع</button>
<button class="shape-btn" onclick="setShape(10, this)">ناعمة</button>
<button class="shape-btn active" onclick="setShape(18, this)">افتراضي</button>
<button class="shape-btn" onclick="setShape(30, this)">دائري</button>
</div>
<label style="margin-top:12px;">قيمة الاستدارة الدقيقة</label>
<div class="range-box">
<input type="range" id="radiusRange" min="0" max="40" value="18">
<input type="number" id="radiusNum" value="18" min="0" max="40"> px
</div>
</div>

<div class="designer-card">
<h3><i class="fa-solid fa-gear" style="color:#0b7dbd;"></i> إعدادات إضافية</h3>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
<label style="margin:0;">إظهار اللوجو</label>
<input type="checkbox" id="toggleLogo" checked style="width:18px;height:18px;cursor:pointer;">
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
<label style="margin:0;">إظهار الوصف</label>
<input type="checkbox" id="toggleDesc" checked style="width:18px;height:18px;cursor:pointer;">
</div>
</div>

</div>

<!-- معاينة الموبايل المصغرة والعائمة في الجانب -->
<div class="preview-container">
<div class="phone-frame">
<div id="livePreviewScreen" class="preview-screen">

<!-- برواز اللوجو -->
<div id="prevLogoWrapper" class="preview-logo-container">
    <img id="prevLogoImg" src="assets/card-bg.jpg">
</div>

<div id="prevName">مكة - Maka</div>
<div id="prevDesc">سرعة في التنفيذ • دقة في التفاصيل</div>

<!-- الأزرار التجريبية المعاينة -->
<div class="preview-links">
<a class="preview-btn"><img src="assets/call.png"><span>Call me</span></a>
<a class="preview-btn"><img src="assets/facebook.png"><span>Facebook</span></a>
<a class="preview-btn"><img src="assets/review.png"><span>Review</span></a>
<a class="preview-btn"><img src="assets/cash.png"><span>Vodafone Cash</span></a>
</div>

<div class="preview-footer">جميع الحقوق محفوظة ✓</div>

</div>
</div>
</div>

</div>

<script>
const screenEl = document.getElementById('livePreviewScreen');
const logoWrapper = document.getElementById('prevLogoWrapper');
const descEl = document.getElementById('prevDesc');

// تغيير الخط
document.getElementById('fontSelector').addEventListener('change', (e) => {
    screenEl.style.fontFamily = e.target.value;
    document.querySelectorAll('.preview-btn').forEach(btn => btn.style.fontFamily = e.target.value);
});

// حجم خط الأزرار
const fontSizeRange = document.getElementById('fontSizeRange');
const fontSizeNum = document.getElementById('fontSizeNum');
function updateFontSize(val) {
    fontSizeRange.value = val;
    fontSizeNum.value = val;
    document.querySelectorAll('.preview-btn').forEach(btn => {
        btn.style.fontSize = val + 'px';
    });
}
fontSizeRange.addEventListener('input', (e) => updateFontSize(e.target.value));
fontSizeNum.addEventListener('input', (e) => updateFontSize(e.target.value));

// استدارة الأزرار والبرواز
const radiusRange = document.getElementById('radiusRange');
const radiusNum = document.getElementById('radiusNum');

function applyRadius(val) {
    radiusRange.value = val;
    radiusNum.value = val;
    logoWrapper.style.borderRadius = val + 'px';
    document.querySelectorAll('.preview-btn').forEach(btn => {
        btn.style.borderRadius = val + 'px';
    });
}

function setShape(val, btnElement) {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    if(btnElement) btnElement.classList.add('active');
    applyRadius(val);
}

radiusRange.addEventListener('input', (e) => applyRadius(e.target.value));
radiusNum.addEventListener('input', (e) => applyRadius(e.target.value));

// إظهار وإخفاء اللوجو
document.getElementById('toggleLogo').addEventListener('change', (e) => {
    logoWrapper.style.display = e.target.checked ? 'flex' : 'none';
});

// إظهار وإخفاء الوصف
document.getElementById('toggleDesc').addEventListener('change', (e) => {
    descEl.style.display = e.target.checked ? 'block' : 'none';
});
</script>

</body>
</html>
