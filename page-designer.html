<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تخصيص صفحة العميل - الورشة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#f0f3f8;
    padding:15px;
    color:#333;
}

/* التخطيط العام */
.designer-layout{
    position:relative;
    display:block;
}

.designer-panel{
    position:relative;
    z-index:1;
    width:100%;
}

/* شاشة المعاينة */
.preview-container{
    position:sticky;
    top:15px;
    float:left;
    margin-left:10px;
    z-index:99999;
    transform:scale(.95);
    transform-origin:top right;
}

.phone-frame{
    width:280px;
    height:580px;
    background:#111;
    padding:8px;
    border-radius:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

#previewFrame{
    width:100%;
    height:100%;
    border:none;
    border-radius:28px;
    background:#fff;
}

@media(max-width:992px){

.preview-container{
    position:relative !important;
    top:0 !important;
    float:none;
    margin:0 auto 15px auto;
    width:fit-content;
}

.phone-frame{
    width:170px;
    height:340px;
}
}
</style>
</head>
<body>

<div class="designer-layout">

    <!-- معاينة صفحة العميل الحقيقية -->
    <div class="preview-container">
        <div class="phone-frame">
            <iframe
                id="previewFrame"
                src="qr.html?id=CODE001">
            </iframe>
        </div>
    </div>

    <!-- سيتم وضع أدوات التخصيص هنا لاحقاً -->
    <div class="designer-panel">

    </div>

</div>

<script>
function updatePagePreview(customerId){

    if(!customerId) return;

    document.getElementById("previewFrame").src =
        "qr.html?id=" + customerId +
        "&t=" + Date.now();
}
</script>

</body>
</html>
