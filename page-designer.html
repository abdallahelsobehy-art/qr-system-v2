<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تخصيص صفحة العميل - الورشة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f0f3f8;
    font-family:'Cairo',sans-serif;
    padding:15px;
}

/* التخطيط */

.designer-layout{
    display:flex;
    flex-direction:row-reverse;
    gap:20px;
    align-items:flex-start;
}

/* منطقة الأدوات */

.designer-panel{
    flex:1;
    min-height:1200px;
}

/* شاشة المعاينة */

.preview-container{
    position:sticky;
    top:15px;
    width:300px;
    flex-shrink:0;
    z-index:999;
}

.phone-frame{
    width:280px;
    height:580px;
    background:#111;
    padding:8px;
    border-radius:35px;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

#previewFrame{
    width:100%;
    height:100%;
    border:none;
    border-radius:28px;
    background:#fff;
}

/* عناصر مؤقتة لحين إضافة أدوات التخصيص */

.empty-box{
    background:#fff;
    border-radius:15px;
    padding:25px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.empty-box h3{
    margin-bottom:10px;
    color:#111;
}

.empty-box p{
    color:#666;
    line-height:1.8;
}

/* موبايل */

@media(max-width:992px){

    .designer-layout{
        display:block;
    }

    .preview-container{
        position:relative;
        top:auto;
        width:100%;
        margin-bottom:20px;
    }

    .phone-frame{
        width:180px;
        height:360px;
        margin:auto;
    }
}

</style>
</head>
<body>

<div class="designer-layout">

    <!-- شاشة المعاينة -->

    <div class="preview-container">

        <div class="phone-frame">

            <iframe
                id="previewFrame"
                src="qr.html">
            </iframe>

        </div>

    </div>

    <!-- أدوات التخصيص -->

    <div class="designer-panel">

        <div class="empty-box">
            <h3>تخصيص صفحة العميل</h3>
            <p>
                سيتم إضافة أدوات التخصيص هنا لاحقاً.
            </p>
        </div>

    </div>

</div>

<script>

/* تحديث المعاينة */

function updatePagePreview(customerCode){

    if(!customerCode) return;

    document.getElementById("previewFrame").src =
        "qr.html?id=" +
        encodeURIComponent(customerCode) +
        "&t=" +
        Date.now();
}

/* جلب الكود من صفحة الأدمن تلقائياً */

function syncWithAdmin(){

    try{

        const parentDoc = window.parent.document;

        const codeInput =
            parentDoc.getElementById("code");

        if(!codeInput) return;

        if(codeInput.value){

            updatePagePreview(codeInput.value);
        }

        codeInput.addEventListener("input",function(){

            updatePagePreview(this.value);

        });

        const customerSelect =
            parentDoc.getElementById("customerSelect");

        if(customerSelect){

            customerSelect.addEventListener("change",function(){

                setTimeout(function(){

                    const currentCode =
                        parentDoc.getElementById("code").value;

                    updatePagePreview(currentCode);

                },500);

            });

        }

    }catch(err){

        console.log(err);

    }

}

window.onload = function(){

    syncWithAdmin();

};

</script>

</body>
</html>
