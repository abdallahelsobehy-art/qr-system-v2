<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تخصيص صفحة العميل - الورشة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f0f3f8;
    font-family:'Cairo',sans-serif;
    padding:15px;
}

/* التخطيط */
.designer-layout{
    display:flex;
    flex-direction:row-reverse;
    gap:20px;
    align-items:flex-start;
}

/* منطقة الأدوات */
.designer-panel{
    flex:1;
    min-height:1200px;
}

/* شاشة المعاينة */
.preview-container{
    position:sticky;
    top:15px;
    width:180px;
    flex-shrink:0;
}

.phone-frame{
    width:180px;
    height:360px;
    background:#111;
    border-radius:25px;
    overflow:hidden;
    margin:auto;
    position:relative;
    padding:0;
}

#previewFrame{
    width:375px;
    height:812px;

    border:none;
    background:#fff;

    position:absolute;
    top:0;
    right:0;

    transform:scale(0.48);
    transform-origin:top right;
}

/* بطاقات أقسام التخصيص */
.designer-card {
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,.05);
}

.designer-card h3 {
    margin-bottom: 15px;
    color: #111;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid #edf2f7;
    padding-bottom: 10px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
    color: #444;
    font-size: 13px;
}

input[type="text"], input[type="color"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background-color: #fff;
    transition: border-color 0.2s;
    font-family: 'Cairo', sans-serif;
}

input[type="color"] {
    height: 42px;
    padding: 4px;
    cursor: pointer;
}

input[type="text"]:focus, select:focus {
    border-color: #3b82f6;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
    gap: 8px;
    margin-bottom: 10px;
}

.option-box {
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.option-box:hover {
    border-color: #cbd5e0;
    background: #f8fafc;
}

.option-box.active {
    border-color: #3b82f6;
    background: #eff6ff;
    box-shadow: 0 0 0 1px #3b82f6;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: 'Cairo', sans-serif;
}

.btn-save-design {
    background-color: #111;
    color: #fff;
    margin-top: 10px;
}

.btn:hover {
    opacity: 0.9;
}

/* معاينة الخطوط */
.font-cairo { font-family: 'Cairo', sans-serif; }
.font-tajawal { font-family: 'Tajawal', sans-serif; }
.font-changa { font-family: 'Changa', sans-serif; }

/* موبايل */
@media(max-width:992px){

    .designer-layout{
        display:block;
    }

    .preview-container{
        position:relative;
        top:auto;
        width:100%;
        margin-bottom:20px;
    }

    .phone-frame{
        width:180px;
        height:360px;
        margin:auto;
    }
}
</style>
</head>
<body>

<div class="designer-layout">

    <!-- شاشة المعاينة -->
    <div class="preview-container">
        <div class="phone-frame">
            <iframe id="previewFrame" src="qr.html"></iframe>
        </div>
    </div>

    <!-- أدوات التخصيص -->
    <div class="designer-panel">

        <!-- 1. تخصيص الألوان الأساسية والخلفية -->
        <div class="designer-card">
            <h3><i class="fa-solid fa-palette"></i> ألوان الهوية والخلفية</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>لون الخلفية العامة</label>
                    <input type="color" id="designBgColor" value="#f8fafc" oninput="triggerLiveUpdate()">
                </div>
                <div class="form-group">
                    <label>اللون الرئيسي (Primary)</label>
                    <input type="color" id="designPrimaryColor" value="#111111" oninput="triggerLiveUpdate()">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>لون النصوص</label>
                    <input type="color" id="designTextColor" value="#2d3748" oninput="triggerLiveUpdate()">
                </div>
                <div class="form-group">
                    <label>لون كروت التواصل</label>
                    <input type="color" id="designCardBgColor" value="#ffffff" oninput="triggerLiveUpdate()">
                </div>
            </div>
        </div>

        <!-- 2. الخطوط ونمط العرض -->
        <div class="designer-card">
            <h3><i class="fa-solid fa-font"></i> الخطوط والنمط البصري</h3>
            <div class="form-group">
                <label>نوع خط الكتابة</label>
                <select id="designFontFamily" onchange="triggerLiveUpdate()">
                    <option value="'Cairo', sans-serif" selected>خط كايرو (Cairo)</option>
                    <option value="'Tajawal', sans-serif">خط تجوال (Tajawal)</option>
                    <option value="'Changa', sans-serif">خط شانجا (Changa)</option>
                </select>
            </div>
            <div class="form-group">
                <label>شكل أزرار التواصل</label>
                <input type="hidden" id="designCardStyle" value="rounded">
                <div class="options-grid">
                    <div class="option-box active" onclick="selectDesignOption('designCardStyle', 'rounded', this)" title="دائري ناعم">نصف دائرى</div>
                    <div class="option-box" onclick="selectDesignOption('designCardStyle', 'pill', this)" title="كبسولة">كبسولة</div>
                    <div class="option-box" onclick="selectDesignOption('designCardStyle', 'square', this)" title="مربع زوايا حادة">مربع</div>
                </div>
            </div>
        </div>

        <!-- 3. تأثيرات بصرية ومظهر الأيقونات -->
        <div class="designer-card">
            <h3><i class="fa-solid fa-wand-magic-sparkles"></i> شكل الأيقونات والمظهر</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label>لون أيقونات التواصل</label>
                    <input type="color" id="designIconColor" value="#3b82f6" oninput="triggerLiveUpdate()">
                </div>
                <div class="form-group">
                    <label>نمط عرض الأيقونات</label>
                    <select id="designIconsLayout" onchange="triggerLiveUpdate()">
                        <option value="grid" selected>شبكة (Grid مرتين بجوار بعض)</option>
                        <option value="list">قائمة عمودية (List تحت بعض)</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-save-design" onclick="saveDesignSettings()"><i class="fa-solid fa-floppy-disk"></i> حفظ إعدادات التصميم</button>
        </div>

    </div>

</div>

<script>
let currentLoadedCode = "";

/* تحديث المعاينة مع إرسال إعدادات التصميم الحالية لصفحة الـ QR فوراً */
function updatePagePreview(customerCode){
    if(!customerCode) return;
    currentLoadedCode = customerCode;

    const iframe = document.getElementById("previewFrame");
    
    // بناء رابط المعاينة مع تمرير كود العميل والتصميم المخصص الحالي كـ Query Parameters
    const bg = encodeURIComponent(document.getElementById("designBgColor").value);
    const primary = encodeURIComponent(document.getElementById("designPrimaryColor").value);
    const text = encodeURIComponent(document.getElementById("designTextColor").value);
    const cardBg = encodeURIComponent(document.getElementById("designCardBgColor").value);
    const font = encodeURIComponent(document.getElementById("designFontFamily").value);
    const cardStyle = encodeURIComponent(document.getElementById("designCardStyle").value);
    const iconColor = encodeURIComponent(document.getElementById("designIconColor").value);
    const iconsLayout = encodeURIComponent(document.getElementById("designIconsLayout").value);

    iframe.src = `qr.html?id=${encodeURIComponent(customerCode)}&bg=${bg}&primary=${primary}&text=${text}&cardBg=${cardBg}&font=${font}&cardStyle=${cardStyle}&iconColor=${iconColor}&iconsLayout=${iconsLayout}&t=${Date.now()}`;
}

function triggerLiveUpdate() {
    if (currentLoadedCode) {
        updatePagePreview(currentLoadedCode);
    }
}

function selectDesignOption(hiddenId, value, element) {
    document.getElementById(hiddenId).value = value;
    const parentGrid = element.parentElement;
    parentGrid.querySelectorAll('.option-box').forEach(box => box.classList.remove('active'));
    element.classList.add('active');
    triggerLiveUpdate();
}

function saveDesignSettings() {
    if (!currentLoadedCode) {
        alert("لا يوجد عميل محدد لحفظ إعدادات التصميم الخاصة به.");
        return;
    }

    // تجميع إعدادات التصميم لحفظها في قاعدة البيانات تحت العميل
    const designData = {
        bgColor: document.getElementById("designBgColor").value,
        primaryColor: document.getElementById("designPrimaryColor").value,
        textColor: document.getElementById("designTextColor").value,
        cardBgColor: document.getElementById("designCardBgColor").value,
        fontFamily: document.getElementById("designFontFamily").value,
        cardStyle: document.getElementById("designCardStyle").value,
        iconColor: document.getElementById("designIconColor").value,
        iconsLayout: document.getElementById("designIconsLayout").value
    };

    // التواصل مع الـ Firebase عبر الـ parent (لوحة التحكم الرئيسية) لحفظ التخصيص
    try {
        const parentWindow = window.parent;
        if (parentWindow && parentWindow.db) {
            parentWindow.db.ref("customers/" + currentLoadedCode + "/design").set(designData)
            .then(() => {
                alert("تم حفظ إعدادات التصميم الخاصة بالعميل بنجاح!");
            })
            .catch(err => {
                alert("حدث خطأ أثناء الحفظ: " + err.message);
            });
        }
    } catch (e) {
        console.log("Database connection error:", e);
        alert("تم تطبيق التصميم محلياً بنجاح.");
    }
}

/* جلب الكود من صفحة الأدمن تلقائياً ومزامنة البيانات */
function syncWithAdmin(){
    try{
        const parentDoc = window.parent.document;
        const codeInput = parentDoc.getElementById("code");

        if(!codeInput) return;

        if(codeInput.value){
            updatePagePreview(codeInput.value);
            loadCustomerDesign(codeInput.value);
        }

        codeInput.addEventListener("input", function(){
            updatePagePreview(this.value);
            loadCustomerDesign(this.value);
        });

        const customerSelect = parentDoc.getElementById("customerSelect");
        if(customerSelect){
            customerSelect.addEventListener("change", function(){
                setTimeout(function(){
                    const currentCode = parentDoc.getElementById("code").value;
                    if (currentCode) {
                        updatePagePreview(currentCode);
                        loadCustomerDesign(currentCode);
                    }
                }, 500);
            });
        }
    }catch(err){
        console.log("Sync error:", err);
    }
}

function loadCustomerDesign(code) {
    try {
        const parentWindow = window.parent;
        if (parentWindow && parentWindow.db) {
            parentWindow.db.ref("customers/" + code + "/design").once("value").then(snapshot => {
                const design = snapshot.val();
                if (design) {
                    if(design.bgColor) document.getElementById("designBgColor").value = design.bgColor;
                    if(design.primaryColor) document.getElementById("designPrimaryColor").value = design.primaryColor;
                    if(design.textColor) document.getElementById("designTextColor").value = design.textColor;
                    if(design.cardBgColor) document.getElementById("designCardBgColor").value = design.cardBgColor;
                    if(design.fontFamily) document.getElementById("designFontFamily").value = design.fontFamily;
                    if(design.cardStyle) document.getElementById("designCardStyle").value = design.cardStyle;
                    if(design.iconColor) document.getElementById("designIconColor").value = design.iconColor;
                    if(design.iconsLayout) document.getElementById("designIconsLayout").value = design.iconsLayout;
                    
                    updatePagePreview(code);
                }
            });
        }
    } catch(e) {
        console.log("Could not load design from DB", e);
    }
}

window.onload = function(){
    syncWithAdmin();
};
</script>

</body>
</html>
