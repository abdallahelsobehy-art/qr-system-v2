<div class="designer-panel">

    <h2>🎨 تخصيص صفحة العميل</h2>

    <div class="designer-grid">

        <div class="setting-item">
            <label>لون الخلفية</label>
            <input type="color" id="pageBgColor" value="#0ea5e9">
        </div>

        <div class="setting-item">
            <label>لون النص</label>
            <input type="color" id="textColor" value="#ffffff">
        </div>

        <div class="setting-item">
            <label>خط الكتابة</label>
            <select id="fontFamily">
                <option value="Cairo">Cairo</option>
                <option value="Tajawal">Tajawal</option>
                <option value="Almarai">Almarai</option>
                <option value="Changa">Changa</option>
            </select>
        </div>

        <div class="setting-item full-width">
            <label>صورة خلفية الصفحة</label>
            <input type="file" id="bgImageInput" accept="image/*">
        </div>

        <div class="setting-item full-width">
            <label>خلفية الأزرار</label>
            <input type="file" id="buttonBgInput" accept="image/*">
        </div>

        <div class="setting-item">
            <label>لون الأزرار</label>
            <input type="color" id="buttonColor" value="#ffffff">
        </div>

        <div class="setting-item">
            <label>لون نص الأزرار</label>
            <input type="color" id="buttonTextColor" value="#000000">
        </div>

    </div>

    <div class="phone-preview">

        <div class="phone-header">
            معاينة الموبايل
        </div>

        <div id="previewScreen" class="preview-screen">

            <div class="preview-logo">
                LOGO
            </div>

            <h1>اسم النشاط</h1>

            <p>
                وصف النشاط التجاري يظهر هنا
            </p>

            <div class="preview-btn">
                WhatsApp
            </div>

            <div class="preview-btn">
                Facebook
            </div>

            <div class="preview-btn">
                Instagram
            </div>

            <div class="preview-btn">
                Website
            </div>

        </div>

    </div>

</div>
