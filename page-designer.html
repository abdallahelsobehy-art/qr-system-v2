<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page Designer</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#f5f7fa;
padding:15px;
}

/* تخطيط الصفحة: المعاينة في الأعلى، والقوائم تحتها */
.designer-layout{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
max-width:500px;
margin:0 auto;
}

/* حاوية معاينة الموبايل (ثابتة وفوق) */
.phone-preview-wrapper{
position:sticky;
top:15px;
z-index:1000;
width:100%;
display:flex;
justify-content:center;
background:rgba(245, 247, 250, 0.95);
backdrop-filter:blur(5px);
padding:10px 0;
}

/* حجم أصغر وأنيق لموبايل المعاينة */
.phone-frame{
width:280px;
height:520px;
background:#111;
padding:8px;
border-radius:30px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.preview-screen{
height:100%;
border-radius:22px;
overflow:auto;
padding:15px;
background:#0b7dbd;
color:white;
text-align:center;
}

.preview-logo img{
width:80px;
height:80px;
object-fit:cover;
border-radius:50%;
border:3px solid rgba(255,255,255,.4);
}

#previewTitle{
margin-top:10px;
font-size:20px;
}

#previewDesc{
margin-top:6px;
font-size:13px;
opacity:.9;
}

.preview-links{
margin-top:15px;
display:flex;
flex-direction:column;
gap:8px;
}

.preview-btn{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
padding:10px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
border-radius:18px;
font-size:14px;
font-weight:bold;
color:white;
text-decoration:none;
}

.preview-btn i{
font-size:16px;
}

/* لوحة القوائم والإعدادات تحت شاشة المعاينة مباشرة */
.designer-panel{
display:flex;
flex-direction:column;
gap:15px;
width:100%;
}

.designer-card{
background:#fff;
padding:15px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.designer-card h3{
font-size:15px;
margin-bottom:12px;
color:#222;
display:flex;
align-items:center;
gap:8px;
}

.designer-card label{
display:block;
margin-top:10px;
margin-bottom:5px;
font-size:13px;
font-weight:bold;
color:#444;
}

.designer-card input,
.designer-card select{
width:100%;
padding:8px;
border:1px solid #ddd;
border-radius:8px;
font-size:13px;
}

.shape-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:8px;
}

.shape-options button{
border:none;
padding:10px;
background:#0b7dbd;
color:white;
cursor:pointer;
border-radius:8px;
font-weight:bold;
font-size:13px;
}

</style>
</head>
<body>

<div class="designer-layout">

<!-- شاشة الموبايل في الأعلى وثابتة أثناء السكرول -->
<div class="phone-preview-wrapper">
<div class="phone-frame">
<div id="livePreview" class="preview-screen">

<div class="preview-logo">
<img id="previewLogo" src="https://via.placeholder.com/120">
</div>

<h1 id="previewTitle">اسم النشاط</h1>
<p id="previewDesc">وصف النشاط التجاري</p>

<div class="preview-links">
<a class="preview-btn"><i class="fa-solid fa-phone"></i> اتصال</a>
<a class="preview-btn"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
<a class="preview-btn"><i class="fa-brands fa-facebook-f"></i> فيسبوك</a>
<a class="preview-btn"><i class="fa-brands fa-instagram"></i> انستجرام</a>
<a class="preview-btn"><i class="fa-solid fa-globe"></i> الموقع الإلكتروني</a>
<a class="preview-btn"><i class="fa-solid fa-location-dot"></i> الموقع</a>
</div>

</div>
</div>
</div>

<!-- القوائم بالكامل تحت شاشة المعاينة -->
<div class="designer-panel">

<div class="designer-card">
<h3><i class="fa-solid fa-image"></i> خلفية الصفحة</h3>
<label>صورة الخلفية</label>
<input type="file" id="bgImageInput">
<label>لون الخلفية</label>
<input type="color" id="bgColorPicker" value="#0b7dbd">
</div>

<div class="designer-card">
<h3><i class="fa-solid fa-square"></i> خلفية الأزرار</h3>
<label>صورة الأزرار</label>
<input type="file" id="btnBgInput">
<label>لون الأزرار</label>
<input type="color" id="btnColorPicker" value="#ffffff">
</div>

<div class="designer-card">
<h3><i class="fa-solid fa-font"></i> الألوان والخطوط</h3>
<label>لون النص</label>
<input type="color" id="textColorPicker" value="#ffffff">
<label>نوع الخط</label>
<select id="fontSelector">
<option value="Cairo">Cairo</option>
<option value="Tajawal">Tajawal</option>
<option value="Almarai">Almarai</option>
<option value="Changa">Changa</option>
</select>
<label>حجم الخط</label>
<input type="range" id="fontSizeRange" min="12" max="30" value="14">
</div>

<div class="designer-card">
<h3><i class="fa-solid fa-shapes"></i> شكل الأزرار</h3>
<div class="shape-options">
<button onclick="setRadius(0)">مربع</button>
<button onclick="setRadius(10)">ناعمة</button>
<button onclick="setRadius(20)">دائرية</button>
<button onclick="setRadius(100)">كبسولة</button>
</div>
</div>

</div>

</div>

<script>
let currentRadius=18;

function setRadius(radius){
currentRadius=radius;
document.querySelectorAll('.preview-btn').forEach(btn=>{
btn.style.borderRadius=radius+'px';
});
}

document.getElementById('bgColorPicker').addEventListener('input',e=>{
document.getElementById('livePreview').style.background=e.target.value;
});

document.getElementById('textColorPicker').addEventListener('input',e=>{
document.getElementById('livePreview').style.color=e.target.value;
});

document.getElementById('fontSelector').addEventListener('change',e=>{
document.getElementById('livePreview').style.fontFamily=e.target.value;
});

document.getElementById('fontSizeRange').addEventListener('input',e=>{
document.querySelectorAll('.preview-btn').forEach(btn=>{
btn.style.fontSize=e.target.value+'px';
});
});

document.getElementById('btnColorPicker').addEventListener('input',e=>{
document.querySelectorAll('.preview-btn').forEach(btn=>{
btn.style.background=e.target.value;
});
});
</script>

</body>
</html>
