<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تخصيص صفحة العميل - الورشة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif;}
body{background:#f0f3f8;padding:15px;color:#333;}

/* الهيدر العلوي */
.header-top{background:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:15px;}
.header-top h2{font-size:18px;color:#111;display:flex;align-items:center;gap:8px;}
.header-top p{font-size:12px;color:#666;margin-top:2px;}

/* التخطيط العام */
.designer-layout{
    position:relative;
    display:block;
}

.designer-panel{
    position:relative;
    z-index:1;
    width: 100%;
}

.preview-container{
    position: sticky;
    top: 15px;
    float: left;
    margin-left: 10px;
    z-index: 99999;
    transform: scale(.9);
    transform-origin: top right;
}

.phone-frame{
    width:170px;
    height:340px;
    background:#1a1a1a;
    padding:5px;
    border-radius:24px;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.preview-screen{
    height:100%;
    border-radius:20px;
    overflow-y:auto;
    padding:6px;
    background:url("assets/background.jpg") center center/cover no-repeat;
    background-attachment:local;
    color:white;
    text-align:center;
    position:relative;
}

.preview-footer{margin-top:8px;font-size:8px;font-weight:bold;text-shadow:0 2px 3px rgba(0,0,0,.5);}

@media(max-width:992px){
.designer-panel{
    padding-right:0;
}
.preview-container{
    position: relative !important;
    top: 0 !important;
    float: none;
    margin: 0 auto 15px auto;
    width: fit-content;
}
}
</style>
</head>
<body>

<div class="header-top">
<h2>لوحة التحكم</h2>
<p>جاهز لإضافة الأقسام الجديدة حسب رغبتك</p>
</div>

<div class="designer-layout">

<!-- شاشة المعاينة الفارغة -->
<div class="preview-container">
<div class="phone-frame">
<div id="livePreviewScreen" class="preview-screen">
<div class="preview-footer">جميع الحقوق محفوظة ✓</div>
</div>
</div>
</div>

<!-- منطقة المحتوى الفارغة لبدء الشغل من جديد -->
<div class="designer-panel">
    <!-- مكان إضافاتك الجديدة -->
</div>

</div>

</body>
</html>
