<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة وتخصيص صفحة العميل - الورشة</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif;}
body{background:#f0f3f8;padding:15px;color:#333;}

.header-top{background:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.05);margin-bottom:15px;}
.header-top h2{font-size:18px;color:#111;display:flex;align-items:center;gap:8px;}
.header-top p{font-size:12px;color:#666;margin-top:2px;}

.designer-layout{position:relative;display:block;}
.designer-panel{position:relative;z-index:1;width:100%;}

.preview-container{
    position:sticky;
    top:15px;
    float:left;
    margin-left:10px;
    z-index:99999;
    transform:scale(.9);
    transform-origin:top right;
}

.phone-frame{
    width:170px;
    height:340px;
    background:#1a1a1a;
    padding:5px;
    border-radius:24px;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.designer-card{background:#fff;padding:15px;border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.05);margin-bottom:15px;}
.designer-card h3{font-size:14px;margin-bottom:12px;color:#222;display:flex;align-items:center;gap:8px;}
.designer-card h3 i{color:#000 !important;}
.designer-card label{display:block;margin-top:10px;margin-bottom:5px;font-size:12px;font-weight:bold;color:#444;}
.designer-card input[type="text"], .designer-card select, .designer-card input[type="file"]{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:12px;}

.shape-options{display:grid;grid-template-columns:repeat(4, 1fr);gap:5px;margin-top:8px;}
.shape-btn{border:1px solid #ddd;padding:6px 2px;background:#fff;cursor:pointer;border-radius:8px;font-weight:bold;font-size:11px;text-align:center;transition:.2s;}
.shape-btn.active{border-color:#0b7dbd;background:#eef7fc;color:#0b7dbd;}

.range-box{display:flex;align-items:center;gap:10px;margin-top:6px;}
.range-box input[type="range"]{flex:1;}
.range-box input[type="number"]{width:55px;text-align:center;padding:5px;border:1px solid #ddd;border-radius:6px;font-size:12px;}

.preview-screen{
    height:100%;
    border-radius:20px;
    overflow-y:auto;
    padding:6px;
    background:url("assets/background.jpg") center center/cover no-repeat;
    background-attachment:local;
    color:white;
    text-align:center;
    position:relative;
}

.preview-logo-container{
    width:100%;
    height:65px;
    border-radius:8px;
    margin:4px auto;
    overflow:hidden;
    position:relative;
    background:url("assets/card-bg.jpg") center center/cover;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    display:none; 
}
.preview-logo-container::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.75);
    z-index:1;
}
.preview-logo-container img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    position:relative;
    z-index:2;
    display:block;
}

#prevName{font-size:12px;margin-bottom:2px;text-shadow:0 2px 4px rgba(0,0,0,.5);font-weight:bold;}
#prevDesc{font-size:8px;margin-bottom:6px;text-shadow:0 2px 4px rgba(0,0,0,.5);opacity:.9;display:none;}

.preview-links{display:flex;flex-direction:column;gap:4px;margin-top:5px;}
.preview-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:5px 6px;
    border-radius:18px;
    text-decoration:none;
    color:#111;
    font-size:10px;
    font-weight:bold;
    position:relative;
    overflow:hidden;
    background:url("assets/card-bg.jpg");
    background-size:cover;
    background-position:center;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}
.preview-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.75);
}
.preview-btn span{position:relative;z-index:2;}

.preview-footer{margin-top:8px;font-size:8px;font-weight:bold;text-shadow:0 2px 3px rgba(0,0,0,.5);}

@media(max-width:992px){
.designer-panel{padding-right:0;}
.preview-container{position:relative !important;top:0 !important;float:none;margin:0 auto 15px auto;width:fit-content;}
}
</style>
</head>
<body>

<div class="header-top">
<h2>إدارة وتخصيص صفحة العميل</h2>
<p>قم بملء البيانات في الأقسام الثلاثة أدناه لتظهر فوراً داخل شاشة المعاينة</p>
</div>

<div class="designer-layout">

<!-- شاشة المعاينة (تبدأ فارغة وتتحدث ديناميكياً) -->
<div class="preview-container">
<div class="phone-frame">
<div id="livePreviewScreen" class="preview-screen">

<div id="prevLogoWrapper" class="preview-logo-container">
    <img id="prevLogoImg" src="">
</div>

<div id="prevName"></div>
<div id="prevDesc"></div>

<div id="prevLinksContainer" class="preview-links"></div>

<div class="preview-footer">جميع الحقوق محفوظة ✓</div>

</div>
</div>
</div>

<!-- لوحة التحكم والقوائم -->
<div class="designer-panel">

<!-- 1. بيانات العميل -->
<div class="designer-card">
<h3><i class="fa-solid fa-user-pen"></i> 1. بيانات العميل</h3>
<label>اسم العميل / النشاط</label>
<input type="text5" id="inputClientName" placeholder="أدخل اسم النشاط هنا..." oninput="updateClientName(this.value)">

<label>الوصف المختصر</label>
<input type="text" id="inputClientDesc" placeholder="أدخل وصف النشاط..." oninput="updateClientDesc(this.value)">

<label>شعار العميل (اللوجو)</label>
<input type="file" id="inputClientLogo" accept="image/*" onchange="updateLogo(event)">
</div>

<!-- 2. التواصل والروابط -->
<div class="designer-card">
<h3><i class="fa-solid fa-address-book"></i> 2. التواصل والروابط</h3>
<label>رابط واتساب / اتصال</label>
<input type="text" id="inputPhone" placeholder="رقم الهاتف أو رابط واتساب" oninput="updateLinks()">

<label>رابط صفحة فيسبوك</label>
<input type="text" id="inputFacebook" placeholder="رابط الفيسبوك" oninput="updateLinks()">

<label>رابط تقييم العملاء (Review)</label>
<input type="text" id="inputReview" placeholder="رابط التقييم" oninput="updateLinks()">
</div>

<!-- 3. تصميم وتوليد QR -->
<div class="designer-card">
<h3><i class="fa-solid fa-palette"></i> 3. تصميم وتوليد QR وإعدادات العرض</h3>
<label>نوع الخط</label>
<select id="fontSelector" onchange="updateFont(this.value)">
<option value="Tahoma">Tahoma</option>
<option value="Cairo">Cairo</option>
<option value="Tajawal">Tajawal</option>
<option value="Almarai">Almarai</option>
<option value="Changa">Changa</option>
</select>

<label>حجم خط الأزرار</label>
<div class="range-box">
<input type="range" id="fontSizeRange" min="8" max="16" value="10" oninput="updateFontSize(this.value)">
<input type="number" id="fontSizeNum" value="10" min="8" max="16" oninput="updateFontSize(this.value)"> px
</div>

<label>استدارة الأزرار والبرواز</label>
<div class="shape-options">
<button class="shape-btn" type="button" onclick="setShape(0, this)">مربع</button>
<button class="shape-btn" type="button" onclick="setShape(10, this)">ناعمة</button>
<button class="shape-btn active" type="button" onclick="setShape(18, this)">افتراضي</button>
<button class="shape-btn" type="button" onclick="setShape(30, this)">دائري</button>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
<label style="margin:0;">إظهار اللوجو</label>
<input type="checkbox" id="toggleLogo" checked onchange="toggleLogoVisibility()" style="width:18px;height:18px;cursor:pointer;">
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
<label style="margin:0;">إظهار الوصف</label>
<input type="checkbox" id="toggleDesc" checked onchange="toggleDescVisibility()" style="width:18px;height:18px;cursor:pointer;">
</div>
</div>

</div>

</div>

<script>
let currentRadius = 18;
let currentFontSize = 10;

// 1. تحديث الاسم
function updateClientName(val) {
    document.getElementById('prevName').innerText = val;
}

// 2. تحديث الوصف
function updateClientDesc(val) {
    const descEl = document.getElementById('prevDesc');
    descEl.innerText = val;
    descEl.style.display = (val.trim() !== '' && document.getElementById('toggleDesc').checked) ? 'block' : 'none';
}

// 3. تحديث اللوجو
function updateLogo(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const logoImg = document.getElementById('prevLogoImg');
            logoImg.src = e.target.result;
            const logoWrapper = document.getElementById('prevLogoWrapper');
            logoWrapper.style.display = document.getElementById('toggleLogo').checked ? 'flex' : 'none';
            logoWrapper.style.borderRadius = currentRadius + 'px';
        }
        reader.readAsDataURL(file);
    }
}

// 4. تحديث الروابط وأزرار التواصل فورياً
function updateLinks() {
    const phone = document.getElementById('inputPhone').value.trim();
    const facebook = document.getElementById('inputFacebook').value.trim();
    const review = document.getElementById('inputReview').value.trim();
    
    let container = document.getElementById('prevLinksContainer');
    container.innerHTML = '';

    if(phone) {
        container.innerHTML += `<a class="preview-btn" style="border-radius:${currentRadius}px; font-size:${currentFontSize}px;"><span>اتصال / واتساب</span></a>`;
    }
    if(facebook) {
        container.innerHTML += `<a class="preview-btn" style="border-radius:${currentRadius}px; font-size:${currentFontSize}px;"><span>فيسبوك</span></a>`;
    }
    if(review) {
        container.innerHTML += `<a class="preview-btn" style="border-radius:${currentRadius}px; font-size:${currentFontSize}px;"><span>تقييم العميل</span></a>`;
    }
}

// 5. إعدادات الخطوط والتصميم
function updateFont(fontFamily) {
    document.getElementById('livePreviewScreen').style.fontFamily = fontFamily;
    document.querySelectorAll('.preview-btn').forEach(btn => btn.style.fontFamily = fontFamily);
}

function updateFontSize(val) {
    document.getElementById('fontSizeRange').value = val;
    document.getElementById('fontSizeNum').value = val;
    currentFontSize = val;
    document.querySelectorAll('.preview-btn').forEach(btn => {
        btn.style.fontSize = val + 'px';
    });
}

function setShape(val, btnElement) {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    if(btnElement) btnElement.classList.add('active');
    currentRadius = val;
    
    const logoWrapper = document.getElementById('prevLogoWrapper');
    if(logoWrapper) logoWrapper.style.borderRadius = val + 'px';
    
    document.querySelectorAll('.preview-btn').forEach(btn => {
        btn.style.borderRadius = val + 'px';
    });
}

function toggleLogoVisibility() {
    const isChecked = document.getElementById('toggleLogo').checked;
    const logoWrapper = document.getElementById('prevLogoWrapper');
    const logoImg = document.getElementById('prevLogoImg');
    logoWrapper.style.display = (isChecked && logoImg.src) ? 'flex' : 'none';
}

function toggleDescVisibility() {
    const isChecked = document.getElementById('toggleDesc').checked;
    const descEl = document.getElementById('prevDesc');
    descEl.style.display = (isChecked && descEl.innerText.trim() !== '') ? 'block' : 'none';
}
</script>

</body>
</html>
